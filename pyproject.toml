[project]
name = "kling-direct"
description = "Direct Kling AI integration for ComfyUI with schema-driven Kling video/image CLI-MCP support, Kling 4.x compatibility nodes, Image 3.0/O1, and Kling 3.0 REST"
version = "4.2.2"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "Pillow",
    "numpy",
    "scipy",
    "soundfile",
    "opencv-python-headless",
]

[project.urls]
Repository = "https://github.com/maglat/ComfyUI-Kling-Direct"

